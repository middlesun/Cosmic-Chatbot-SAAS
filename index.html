<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CosmicCouncil - Your personal AI astrologer</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600&family=Inter:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --celestial-sand: #F7F3EF;
            --celestial-parchment: #FDFCFB;
            --midnight-indigo: #1A1C2E;
            --soft-gold: #C5A059;
            --brand-secondary: #7c6d5e;
            --brand-light: #fdfce9;

            /* Oura-inspired SaaS App Tokens (/app/*) */
            --cc-canvas: #FAF7F2;
            --cc-surface: #F1ECE3;
            --cc-surface-elevated: #FDFBF7;
            --cc-glass: rgba(234, 227, 215, 0.72);
            --cc-ink-display: #3D3830;
            --cc-ink-body: #5C5449;
            --cc-ink-muted: #8B8275;
            --cc-cta: #4A453D;
            --cc-cta-hover: #38342E;
            --cc-border: rgba(61, 56, 48, 0.10);
            --cc-radar-dark: #1F2229;
            --cc-radar-elevated: #292D36;
            --cc-radar-ink: #F4EFE6;
            --cc-accent-brass: #B8965A;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--celestial-sand);
            color: var(--midnight-indigo);
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Cosmic Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(197, 160, 89, 0.03) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(79, 70, 229, 0.03) 0%, transparent 40%);
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='400' height='400' viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1h1v1H1V1zm100 100h1v1h-1v-1zm150 50h1v1h-1v-1zM50 250h1v1h-1v-1zm300 80h1v1h-1v-1zM200 150h1v1h-1v-1zm-50 200h1v1h-1v-1z' fill='%23C5A059' fill-opacity='0.15' fill-rule='evenodd'/%3E%3C/svg%3E");
            z-index: -1;
            pointer-events: none;
        }

        .font-serif {
            font-family: 'Cormorant+Garamond', serif;
        }

        .luxury-gradient {
            background: linear-gradient(135deg, var(--celestial-sand) 0%, #E8E2D9 100%);
        }

        .soft-gold { color: var(--soft-gold); }
        .bg-soft-gold { background-color: var(--soft-gold); }

        /* Silky Transitions */
        .transition-silky {
            transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        
        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(60px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .animate-slide-up-fade {
            animation: slideUpFade 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-fade-in {
            animation: fadeIn 1.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes ccSlideDown {
            from { opacity: 0; transform: translateY(-16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes ccSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes ccTabPanelIn {
            from { opacity: 0; transform: translateY(10px) scale(0.99); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes ccDrawerIn {
            from { opacity: 0; transform: translateY(-8px) scale(0.985); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes ccDropdownDown {
            from { opacity: 0; transform: translateY(-6px) scale(0.985); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes ccDropdownUp {
            from { opacity: 0; transform: translateY(6px) scale(0.985); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes ccMessageIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-cc-slide-down {
            animation: ccSlideDown 0.65s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .animate-cc-slide-up {
            animation: ccSlideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .animate-cc-tab-panel {
            animation: ccTabPanelIn 0.34s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .animate-cc-drawer-in {
            animation: ccDrawerIn 0.24s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .animate-cc-dropdown-down {
            animation: ccDropdownDown 0.18s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .animate-cc-dropdown-up {
            animation: ccDropdownUp 0.18s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .animate-cc-message-in {
            animation: ccMessageIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @media (prefers-reduced-motion: reduce) {
            .animate-slide-up-fade,
            .animate-fade-in,
            .animate-cc-slide-down,
            .animate-cc-slide-up,
            .animate-cc-tab-panel,
            .animate-cc-drawer-in,
            .animate-cc-dropdown-down,
            .animate-cc-dropdown-up,
            .animate-cc-message-in {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
        }

        /* Subtle Ivory & Sandstone Scrollbars */
        * {
            scrollbar-width: thin;
            scrollbar-color: #D6CEC2 transparent;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background-color: #D6CEC2;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background-color: #B8B0A4;
        }

        /* Subtle Observatory Night Scrollbars inside dark containers */
        .observatory-dark-scroll,
        .observatory-dark-scroll *,
        [class*="from-[#1F2229]"],
        [class*="from-[#1F2229]"] * {
            scrollbar-color: #4A4F5A #1F2229;
        }
        .observatory-dark-scroll::-webkit-scrollbar-track,
        .observatory-dark-scroll *::-webkit-scrollbar-track,
        [class*="from-[#1F2229]"]::-webkit-scrollbar-track,
        [class*="from-[#1F2229]"] *::-webkit-scrollbar-track {
            background: #1F2229;
        }
        .observatory-dark-scroll::-webkit-scrollbar-thumb,
        .observatory-dark-scroll *::-webkit-scrollbar-thumb,
        [class*="from-[#1F2229]"]::-webkit-scrollbar-thumb,
        [class*="from-[#1F2229]"] *::-webkit-scrollbar-thumb {
            background-color: #4A4F5A;
        }
        .observatory-dark-scroll::-webkit-scrollbar-thumb:hover,
        .observatory-dark-scroll *::-webkit-scrollbar-thumb:hover,
        [class*="from-[#1F2229]"]::-webkit-scrollbar-thumb:hover,
        [class*="from-[#1F2229]"] *::-webkit-scrollbar-thumb:hover {
            background-color: #636978;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .btn-gradient-indigo {
            background: linear-gradient(135deg, #4F46E5 0%, #312E81 100%);
        }
        .btn-gradient-emerald {
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
        }
        .btn-brand-secondary {
            background-color: var(--brand-secondary);
            color: var(--brand-light);
        }
        .filter-active-gradient {
            background: linear-gradient(135deg, #312E81 0%, #1E1B4B 100%);
        }

        /* Celestial Ornamentation */
        .celestial-arc {
            position: absolute;
            border: 1px solid rgba(197, 160, 89, 0.1);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Card Category Gradients */
        .card-grad-consultation { background: linear-gradient(145deg, #F8F5FF 0%, #F0E7FF 100%); }
        .card-grad-love { background: linear-gradient(145deg, #FFF1F2 0%, #FFE4E6 100%); }
        .card-grad-marriage { background: linear-gradient(145deg, #FFF5F5 0%, #FEE2E2 100%); }
        .card-grad-career { background: linear-gradient(145deg, #F0F9FF 0%, #E0F2FE 100%); }
        .card-grad-wealth { background: linear-gradient(145deg, #F0FDF4 0%, #DCFCE7 100%); }
        .card-grad-health { background: linear-gradient(145deg, #E0FEFC 0%, #B2F5EA 100%); }
    </style>
</head>
