<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Completing Sign In | Smart Poster</title>
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg?v=2">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif;
      background: #fdfbf7;
      color: #1e222a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border: 2px solid #1e222a;
      border-radius: 16px;
      box-shadow: 0 4px 0 #1e222a;
      max-width: 420px;
      width: 100%;
      padding: 28px 24px;
      text-align: center;
    }
    .logo {
      width: 44px;
      height: 44px;
      margin: 0 auto 14px;
      display: block;
    }
    h1 {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: #57606f;
      line-height: 1.5;
    }
    .status {
      margin-top: 16px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      background: #f5f3ff;
      color: #5b4bc4;
      border: 1px solid #ddd6fe;
    }
    .status.success {
      background: #ecfdf5;
      color: #15803d;
      border-color: #bbf7d0;
    }
    .status.error {
      background: #fef2f2;
      color: #b91c1c;
      border-color: #fecaca;
    }
    .actions {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: 2px solid #1e222a;
      background: #6c5ce7;
      color: #ffffff;
      box-shadow: 0 2px 0 #1e222a;
    }
    .btn.secondary {
      background: #ffffff;
      color: #1e222a;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/assets/img/favicon.svg?v=2" alt="Smart Poster" class="logo">
    <h1 id="title">Completing Google Sign In...</h1>
    <p id="subtitle">Syncing your account session and cloud workspace.</p>
    <div id="status-box" class="status">Verifying credentials...</div>
    <div id="actions" class="actions" style="display: none;">
      <button id="btn-close-popup" type="button" class="btn">Close Window</button>
      <a id="btn-open-dashboard" href="/dashboard.html" class="btn secondary">Open Dashboard</a>
    </div>
  </div>

  <script>
    (function () {
      const titleEl = document.getElementById('title');
      const subtitleEl = document.getElementById('subtitle');
      const statusEl = document.getElementById('status-box');
      const actionsEl = document.getElementById('actions');
      const closeBtn = document.getElementById('btn-close-popup');
      const dashLink = document.getElementById('btn-open-dashboard');

      function setStatus(msg, type) {
        statusEl.textContent = msg;
        statusEl.className = 'status' + (type ? ' ' + type : '');
      }

      function showError(msg) {
        titleEl.textContent = 'Sign In Failed';
        subtitleEl.textContent = 'Could not finish Google authentication.';
        setStatus(msg || 'Unknown authentication error.', 'error');
        actionsEl.style.display = 'flex';
      }

      closeBtn.addEventListener('click', function () {
        window.close();
      });

      function parseHashParams() {
        const raw = (window.location.hash || '').replace(/^#/, '');
        return new URLSearchParams(raw);
      }

      async function completeAuth() {
        try {
          const searchParams = new URLSearchParams(window.location.search || '');
          const hashParams = parseHashParams();

          const oauthError =
            hashParams.get('error_description') ||
            searchParams.get('error_description') ||
            hashParams.get('error') ||
            searchParams.get('error');

          if (oauthError) {
            throw new Error(oauthError);
          }

          let accessToken = hashParams.get('access_token') || searchParams.get('access_token') || '';
          let refreshToken = hashParams.get('refresh_token') || searchParams.get('refresh_token') || '';
          const code = searchParams.get('code') || '';
          let nextPath = searchParams.get('next') || '';
          if (!nextPath) {
            try {
              nextPath = localStorage.getItem('sp_auth_next') || '';
            } catch (_) {}
          }
          try {
            localStorage.removeItem('sp_auth_next');
          } catch (_) {}
          if (nextPath && (!nextPath.startsWith('/') || nextPath.startsWith('//'))) {
            nextPath = '';
          }

          const cfgRes = await fetch('/api/config').catch(() => null);
          const cfg = cfgRes && cfgRes.ok ? await cfgRes.json().catch(() => null) : null;
          const supabaseUrl = (cfg?.supabase?.url || '').trim().replace(/\/+$/, '');
          const supabaseAnonKey = (cfg?.supabase?.anonKey || '').trim();

          if (!accessToken && code && supabaseUrl && supabaseAnonKey) {
            // Attempt PKCE code exchange if a verifier exists in localStorage
            let verifier = '';
            try {
              for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i) || '';
                if (k.includes('code-verifier') || k.includes('code_verifier')) {
                  verifier = (localStorage.getItem(k) || '').replace(/^"|"$/g, '');
                  if (verifier) break;
                }
              }
            } catch (_) {}

            if (verifier) {
              const tokenRes = await fetch(`${supabaseUrl}/auth/v1/token?grant_type=pkce`, {
                method: 'POST',
                headers: {
                  apikey: supabaseAnonKey,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({ auth_code: code, code_verifier: verifier }),
              });
              const tokenJson = await tokenRes.json().catch(() => null);
              if (tokenRes.ok && tokenJson?.access_token) {
                accessToken = tokenJson.access_token;
                refreshToken = tokenJson.refresh_token || refreshToken;
              }
            }
          }

          if (!accessToken) {
            throw new Error('No access token returned from Google sign-in. Verify Redirect URLs in Supabase include ' + window.location.origin + '/auth/callback.html');
          }

          // Fetch user profile from Supabase Auth
          let authUser = null;
          if (supabaseUrl && supabaseAnonKey) {
            const userRes = await fetch(`${supabaseUrl}/auth/v1/user`, {
              headers: {
                apikey: supabaseAnonKey,
                Authorization: `Bearer ${accessToken}`,
              },
            });
            if (userRes.ok) {
              authUser = await userRes.json().catch(() => null);
            }
          }

          // Fetch server-signed entitlement claim & authoritative tier/role
          let entitlementData = null;
          try {
            const entRes = await fetch('/api/auth/entitlement', {
              headers: { Authorization: `Bearer ${accessToken}` },
            });
            if (entRes.ok) {
              const entJson = await entRes.json().catch(() => null);
              if (entJson && entJson.success) {
                entitlementData = entJson;
              }
            }
          } catch (_) {}

          const userId = entitlementData?.userId || authUser?.id || '';
          const email = (entitlementData?.email || authUser?.email || '').toLowerCase();
          if (!userId || !email) {
            throw new Error('Could not resolve signed-in user profile.');
          }

          const role = entitlementData?.role === 'admin' ? 'admin' : 'user';
          const tier = entitlementData?.tier || (role === 'admin' ? 'unlimited' : 'basic');
          const fullName =
            authUser?.user_metadata?.full_name ||
            authUser?.user_metadata?.name ||
            email.split('@')[0] ||
            'User';
          const avatarUrl =
            authUser?.user_metadata?.avatar_url ||
            authUser?.user_metadata?.picture ||
            '';

          const entitlement = entitlementData?.entitlement || null;
          const sessionObj = {
            user: {
              id: userId,
              email,
              fullName,
              avatarUrl,
              role,
              tier,
            },
            accessToken,
            refreshToken: refreshToken || null,
            token: accessToken,
            entitlement,
            portalOrigin: window.location.origin,
            updatedAt: new Date().toISOString(),
          };

          try {
            localStorage.setItem('authUserSession', JSON.stringify(sessionObj));
            localStorage.setItem('cf_auth_session', JSON.stringify(sessionObj));
            if (entitlement) {
              localStorage.setItem('sp_entitlement_claim', JSON.stringify(entitlement));
            }
          } catch (_) {}

          // Bridge to Chrome extension content.js + opener window if present
          const authPayload = {
            type: 'AUTH_SUCCESS',
            session: sessionObj,
            user: sessionObj.user,
            token: accessToken,
            accessToken,
            refreshToken: refreshToken || null,
            entitlement,
            portalOrigin: window.location.origin,
          };

          window.postMessage(authPayload, window.location.origin);
          if (window.opener && window.opener !== window) {
            try {
              window.opener.postMessage(authPayload, '*');
            } catch (_) {}
          }

          // Clean sensitive hash tokens out of URL bar
          try {
            window.history.replaceState({}, document.title, window.location.pathname + (nextPath ? '?next=' + encodeURIComponent(nextPath) : ''));
          } catch (_) {}

          titleEl.textContent = `Signed in as ${email}`;
          subtitleEl.textContent = 'Your extension and cloud workspace are now linked.';
          setStatus('Syncing with Smart Poster extension...', 'success');
          actionsEl.style.display = 'flex';

          const isPopupWindow = Boolean(window.opener) || (window.innerWidth <= 650 && window.innerHeight <= 760);
          if (nextPath && nextPath.startsWith('/') && !nextPath.startsWith('//')) {
            dashLink.href = nextPath;
            setTimeout(() => {
              window.location.replace(nextPath);
            }, 650);
          } else if (isPopupWindow) {
            setStatus('Signed in! Returning you to Smart Poster...', 'success');
            setTimeout(() => {
              window.close();
            }, 900);
          }
        } catch (err) {
          showError(err?.message || 'Authentication failed.');
        }
      }

      completeAuth();
    })();
  </script>
</body>
</html>
