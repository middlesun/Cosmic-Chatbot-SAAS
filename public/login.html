<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Smart Poster</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png?v=2">
    <link rel="icon" type="image/png" sizes="128x128" href="/assets/img/favicon.png?v=2">
    <link rel="shortcut icon" href="/favicon.ico?v=2">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/brand-theme.css">
</head>
<body class="sp-canvas min-h-screen flex items-center justify-center p-4">
    <div class="sp-card-tactile max-w-md w-full p-8 text-center">
        <!-- Logo / Icon -->
        <img src="/assets/img/favicon.svg" alt="Smart Poster logo" class="w-14 h-14 mx-auto mb-5 object-contain" />

        <h1 class="text-2xl font-extrabold text-[#1e222a] tracking-tight">Smart Poster</h1>
        <p class="text-sm text-[#57606f] mt-2">Sign in to sync your campaigns, brands, and settings to the cloud across devices.</p>

        <!-- Status / Error message container -->
        <div id="login-status" class="hidden mt-4 p-3 rounded-xl text-xs font-medium"></div>

        <!-- Google OAuth Button -->
        <div class="mt-8">
            <button id="google-login-btn" type="button" class="sp-btn-tactile-white w-full flex items-center justify-center gap-3 py-3.5 px-4 rounded-xl text-sm">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Continue with Google (Gmail)</span>
            </button>
        </div>

        <div class="mt-6 pt-6 border-t border-[#dfd8cc] flex flex-col gap-2">
            <p class="text-xs text-[#747d8c]">
                New accounts automatically start on the <strong class="text-[#1e222a]">Free Starter Plan</strong>.
            </p>
            <a href="/" class="text-xs font-semibold text-[#57606f] hover:text-[#6c5ce7] transition">
                &larr; Return to Homepage
            </a>
        </div>
    </div>

    <script>
        const loginBtn = document.getElementById('google-login-btn');
        const statusBox = document.getElementById('login-status');
        const pageParams = new URLSearchParams(window.location.search || '');
        const rawNextParam = pageParams.get('next') || '';
        const safeNextPath = (rawNextParam && rawNextParam.startsWith('/') && !rawNextParam.startsWith('//')) ? rawNextParam : '/dashboard.html';
        try {
            localStorage.setItem('sp_auth_next', safeNextPath);
        } catch (_) {}

        loginBtn.addEventListener('click', async () => {
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="inline-block animate-spin mr-2">⏳</span> Connecting to Google...';

            try {
                // Fetch dynamic Supabase configuration from /api/config
                const configRes = await fetch('/api/config');
                const config = await configRes.json();

                if (!config.success || !config.supabase?.url || !config.supabase?.anonKey) {
                    throw new Error('Supabase project credentials not configured in environment.');
                }

                const supabaseUrl = config.supabase.url.replace(/\/+$/, '');
                const callbackUrl = `${window.location.origin}/auth/callback.html?next=${encodeURIComponent(safeNextPath)}`;

                // Redirect to Supabase Google OAuth provider
                const authUrl = `${supabaseUrl}/auth/v1/authorize?provider=google&redirect_to=${encodeURIComponent(callbackUrl)}`;
                window.location.href = authUrl;
            } catch (err) {
                statusBox.className = 'mt-4 p-3 rounded-xl text-xs font-medium bg-red-50 text-red-700 border border-red-200 block';
                statusBox.textContent = `Login failed: ${err.message}`;
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Continue with Google (Gmail)';
            }
        });
    </script>
</body>
</html>
